nodes:
  - FC
  - RC
  - Pump1
  - Pump2

messages:
  - RC_State:
      id: 0x18
      dlc: 2
      sender: RC
      signals:
        - RC_Error:
            enum: RC_Error
            start_bit: 8
            length: 8
            endianness: "little"
            signed: false
            scale: 1
            offset: 0
            min: 0
            max: 255
            receivers:
              - FC
        - RC_State:
            enum: RC_State
            start_bit: 0
            length: 3
            endianness: "little"
            signed: false
            scale: 1
            offset: 0
            min: 0
            max: 7
            receivers:
              - FC

  - RC_SDC_State:
      id: 0x75
      dlc: 1
      sender: RC
      signals:
        - SDC_Point:
            enum: SDC_Point
            start_bit: 0
            length: 8
            endianness: "little"
            signed: false
            scale: 1
            offset: 0
            min: 0
            max: 255
            receivers:
              - FC

  - FC_SDC_Takes:
      id: 0x201
      dlc: 8
      sender: FC
      signals:
        - SDC_Point:
            enum: SDC_Point
            start_bit: 0
            length: 8
            endianness: "little"
            signed: false
            scale: 1
            offset: 0
            min: 0
            max: 255
            receivers:
              - RC
              - WDAQ

        # - SDC_After_FL_Motor_Raw:
