# clang-format runs on every commit
exclude: |
  (?x)^(
      common/CMSIS/|
      common/FreeRTOS/|
      common/STM32G4xx_HAL/|
      config/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types_or: [c, c++]
      - id: end-of-file-fixer
        types_or: [c, c++]
      - id: check-merge-conflict
      - id: check-yaml

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]
        args: [--style=file]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy (arm-none-eabi)
        entry: python3 scripts/precommit.py
        language: system
        types_or: [c, c++]
        stages: [manual]
        args: [-p, build/firmware, --quiet]
